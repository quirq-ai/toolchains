# Required check for this repo. Hand-written until infra-config generates builders for infra repos.
# Runs on every PR and in the merge queue, so it verifies the exact merge result. The `ci` job at
# the end is the one to require: it fails unless every job before it passed. Promotions have their
# own check, `promotion-gate` (promotion-gate.yml), which judges PRs with main's tools. Both are
# required once the toolchains ruleset from quirq-ai/gate is applied (V0-ORG-03).
name: ci
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install --quiet -r requirements-dev.txt
      - run: python tools/qqtc.py validate
      # The same workflow rules promotion-gate enforces with main's copy of gate.py.
      - run: python tools/gate.py check-workflows .github/workflows
      - run: python -m pytest -q -p no:cacheprovider

  ci:
    needs: [unit]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          jq -e 'all(. == "success")' <<<"$RESULTS"
