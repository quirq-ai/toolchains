# Required check for this repo. Hand-written until infra-config generates builders for infra repos.
# Runs on every PR and in the merge queue, so it verifies the exact merge result.
name: ci
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install --quiet -r requirements-dev.txt
      - run: python tools/qqtc.py validate
      - run: python -m pytest -q -p no:cacheprovider
