# The gate for toolchain pins: every new or moved entry in promoted.toml must be bytes that
# build.yml, running on main, signed provenance for. Its manifest must be the one-layer shape
# qq sync expects, and the spec at that commit must match the pin's version. The pulled bytes
# must also pass the smoke tests and consumer builds again.
#
# A promotion PR must not be able to weaken its own check. So on PRs into main this runs as
# pull_request_target: the workflow, qqtc and the toolchain specs all come from main's tip. The
# PR's files are read only as data and no code from the PR runs. A PR that changes promoted.toml
# may change nothing else except README.md, so a change to the gate itself always arrives in its
# own PR.
# In the merge queue the workflow file comes from the merge result, but qqtc and the specs still
# come from the base commit and every Python call runs isolated (-I), so files in the checkout
# cannot shadow modules. After a push, main is the trust root and its own tools run.
# TODO(suraj): nothing requires this check yet. Make `promotion-gate` a required check next to
# `ci`, for PRs and the merge queue, and give .github/, tools/, toolchains/ and promoted.toml
# owners with required review (V0-ORG-02, V0-ORG-03). Until then the gate is advisory and a
# change to this file is guarded only by review.
name: promotion-gate
on:
  pull_request_target:
    branches: [main]
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: promotion-gate-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}
defaults:
  run:
    shell: bash
jobs:
  promotion-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
      HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      PR: ${{ github.event.pull_request.number }}
      GATE: ${{ github.workspace }}/../gate   # trusted checkout that runs every check below
    steps:
      # On pull_request_target this checks out main's tip, never the PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Load trusted tools and the proposed pins
        id: changed
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "::error::cannot find the base commit '$BASE' to compare promoted.toml against"
            exit 1
          fi
          # The PR's commits, as data only (a fork's commits are not in this repo's branches).
          [ -n "$PR" ] && git fetch --no-tags --quiet origin "$HEAD"

          # Before a merge, trusted tools judge the change: main's tip for a PR (the commit this
          # workflow came from), the queue's base commit in the merge queue. After a push, main is
          # the trust root, so its own tools do.
          case "$GITHUB_EVENT_NAME" in
            pull_request_target)
              tools=$GITHUB_SHA
              git merge-base --is-ancestor "$BASE" "$tools" || { echo "::error::PR base $BASE is not on main"; exit 1; } ;;
            merge_group) tools=$BASE ;;
            *) tools=$HEAD ;;
          esac
          git worktree add --detach "$GATE" "$tools"

          git show "$HEAD:promoted.toml" > "$GATE/promoted.toml" 2>/dev/null || : > "$GATE/promoted.toml"
          git show "$BASE:promoted.toml" > "$RUNNER_TEMP/base.toml" 2>/dev/null || : > "$RUNNER_TEMP/base.toml"

          if [ -n "$PR" ] && ! cmp -s "$GATE/promoted.toml" "$RUNNER_TEMP/base.toml"; then
            files=$(git diff --no-renames --name-only "$BASE...$HEAD")   # a failure here fails the step
            other=$(grep -vxE 'promoted\.toml|README\.md' <<<"$files" || true)
            if [ -n "$other" ]; then
              echo "::error::a PR that changes promoted.toml may change only promoted.toml and README.md. Move these to their own PR:"
              sed 's/^/  /' <<<"$other"   # indented, so a file name cannot act as a workflow command
              exit 1
            fi
          fi

          python -I "$GATE/tools/qqtc.py" promoted-changed --base "$RUNNER_TEMP/base.toml" > "$RUNNER_TEMP/changed.json"
          cat "$RUNNER_TEMP/changed.json"
          echo "count=$(jq length "$RUNNER_TEMP/changed.json")" >> "$GITHUB_OUTPUT"
      - name: Set up ORAS
        if: steps.changed.outputs.count != '0'
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
      - name: Pull and check each new pin
        if: steps.changed.outputs.count != '0'
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$REGISTRY_TOKEN" | oras login ghcr.io -u "$REGISTRY_USER" --password-stdin
          jq -c '.[]' "$RUNNER_TEMP/changed.json" | while read -r entry; do
            name=$(jq -r .name <<<"$entry")
            ref=$(jq -r '.ref | ltrimstr("oci://")' <<<"$entry")
            layer=$(jq -r .layer_sha256 <<<"$entry")
            built_from=$(jq -r .built_from <<<"$entry")
            fail() { echo "::error::$name: $*"; exit 1; }
            echo "::group::check $name ($ref)"

            # 1. Provenance: build.yml on main, at built_from, produced this digest.
            gh attestation verify "oci://$ref" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build.yml" \
              --source-ref refs/heads/main --source-digest "$built_from" \
              || fail "no build provenance from build.yml on main at $built_from for this digest"

            # 2. The spec at that commit describes the version the pin claims.
            #    In the merge queue, also the merged spec, so a spec change batched with the
            #    promotion cannot land a pin that main's push run then rejects. Specs are data here.
            specs=("$built_from")
            [ "$GITHUB_EVENT_NAME" = merge_group ] && specs+=("$HEAD")
            for at in "${specs[@]}"; do
              git show "$at:toolchains/$name/toolchain.toml" > "$RUNNER_TEMP/spec-$name.toml" \
                || fail "toolchains/$name/toolchain.toml does not exist at $at"
              python -I - "$RUNNER_TEMP/spec-$name.toml" "$entry" <<'PY' || fail "the pin's version does not match the spec at $at"
          import json, sys, tomllib
          spec = tomllib.load(open(sys.argv[1], "rb"))["toolchain"]
          entry = json.loads(sys.argv[2])
          bad = [k for k in ("version", "revision", "platform") if spec[k] != entry[k]]
          sys.exit(f"mismatch in {bad}" if bad else 0)
          PY
            done

            # 3. The manifest is exactly one toolchain layer, the one the pin names.
            oras manifest fetch "$ref" > "$RUNNER_TEMP/manifest-$name.json"
            jq -e --arg layer "sha256:$layer" '
              .artifactType == "application/vnd.quirq.toolchain.v1"
              and (.layers | length) == 1
              and .layers[0].digest == $layer
              and .layers[0].mediaType == "application/vnd.quirq.toolchain.layer.v1.tar+gzip"
            ' "$RUNNER_TEMP/manifest-$name.json" >/dev/null || fail "manifest is not one toolchain layer with digest sha256:$layer"

            # 4. The pulled bytes are that layer.
            dir="$RUNNER_TEMP/pull/$name"
            oras pull "$ref" -o "$dir"
            tarball=$(jq -r '.layers[0].annotations["org.opencontainers.image.title"]' "$RUNNER_TEMP/manifest-$name.json")
            echo "$layer  $dir/$tarball" | sha256sum --strict -c -
            python -I "$GATE/tools/qqtc.py" unpack "$dir/$tarball" "$RUNNER_TEMP/root/$name"
            echo "::endgroup::"
          done
          oras logout ghcr.io   # consumer code below runs without registry credentials
      - name: Smoke-test and build consumers from the pulled bytes
        if: steps.changed.outputs.count != '0'
        run: |
          for name in $(jq -r '.[].name' "$RUNNER_TEMP/changed.json"); do
            echo "::group::verify $name"
            python -I "$GATE/tools/qqtc.py" smoke "$name" "$RUNNER_TEMP/root/$name"
            python -I "$GATE/tools/qqtc.py" consumers "$name" "$RUNNER_TEMP/root/$name" --work "$RUNNER_TEMP/consumers/$name"
            echo "::endgroup::"
          done
