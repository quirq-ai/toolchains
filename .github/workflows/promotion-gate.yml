# The gate for toolchain pins: every new or moved entry in promoted.toml must be bytes that
# build.yml, running on main, signed provenance for. Its manifest must be the one-layer shape
# qq sync expects, and the spec at that commit must match the pin's version. The pulled bytes
# must also pass the smoke tests and consumer builds again.
#
# A promotion PR must not be able to weaken its own check. So on PRs this runs as
# pull_request_target: the workflow, qqtc and the toolchain specs all come from the base branch.
# The PR's promoted.toml is read only as data, and no code from the PR runs. A PR that changes
# promoted.toml may change nothing else except README.md, so a change to the gate itself always
# arrives in its own PR.
# In the merge queue and on main, qqtc and the specs still come from the base commit, or from
# main itself after a push.
# TODO(suraj): make `promotion-gate` a required check and give .github/, tools/, toolchains/
# and promoted.toml owners with required review (V0-ORG-02, V0-ORG-03). Until then, a change to
# this file is guarded only by review.
name: promotion-gate
on:
  pull_request_target:
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: promotion-gate-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}
defaults:
  run:
    shell: bash
jobs:
  promotion-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
      HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      PR: ${{ github.event.pull_request.number }}
      GATE: ${{ github.workspace }}/../gate   # trusted checkout that runs every check below
    steps:
      # On pull_request_target this checks out the base branch, never the PR.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Load trusted tools and the proposed pins
        id: changed
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "::error::cannot find the base commit '$BASE' to compare promoted.toml against"
            exit 1
          fi
          # The PR's commits, as data only (a fork's commits are not in this repo's branches).
          [ -n "$PR" ] && git fetch --no-tags --quiet origin "$HEAD"

          # Before a merge, the base commit's tools judge the change. After a push, main is the
          # trust root, so its own tools do.
          tools=$BASE
          [ "$GITHUB_EVENT_NAME" = push ] && tools=$HEAD
          git worktree add --detach "$GATE" "$tools"

          git show "$HEAD:promoted.toml" > "$GATE/promoted.toml" 2>/dev/null || : > "$GATE/promoted.toml"
          git show "$BASE:promoted.toml" > "$RUNNER_TEMP/base.toml" 2>/dev/null || : > "$RUNNER_TEMP/base.toml"

          if [ -n "$PR" ] && ! cmp -s "$GATE/promoted.toml" "$RUNNER_TEMP/base.toml"; then
            other=$(git diff --name-only "$BASE...$HEAD" | grep -vxE 'promoted\.toml|README\.md' || true)
            if [ -n "$other" ]; then
              echo "::error::a PR that changes promoted.toml may change only promoted.toml and README.md. Move these to their own PR:"
              echo "$other"
              exit 1
            fi
          fi

          python "$GATE/tools/qqtc.py" promoted-changed --base "$RUNNER_TEMP/base.toml" > "$RUNNER_TEMP/changed.json"
          cat "$RUNNER_TEMP/changed.json"
          echo "count=$(jq length "$RUNNER_TEMP/changed.json")" >> "$GITHUB_OUTPUT"
      - name: Set up ORAS
        if: steps.changed.outputs.count != '0'
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
      - name: Pull and check each new pin
        if: steps.changed.outputs.count != '0'
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$REGISTRY_TOKEN" | oras login ghcr.io -u "$REGISTRY_USER" --password-stdin
          jq -c '.[]' "$RUNNER_TEMP/changed.json" | while read -r entry; do
            name=$(jq -r .name <<<"$entry")
            ref=$(jq -r '.ref | ltrimstr("oci://")' <<<"$entry")
            layer=$(jq -r .layer_sha256 <<<"$entry")
            built_from=$(jq -r .built_from <<<"$entry")
            fail() { echo "::error::$name: $*"; exit 1; }
            echo "::group::check $name ($ref)"

            # 1. Provenance: build.yml on main, at built_from, produced this digest.
            gh attestation verify "oci://$ref" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build.yml" \
              --source-ref refs/heads/main --source-digest "$built_from" \
              || fail "no build provenance from build.yml on main at $built_from for this digest"

            # 2. The spec at that commit describes the version the pin claims.
            git show "$built_from:toolchains/$name/toolchain.toml" > "$RUNNER_TEMP/spec-$name.toml" \
              || fail "toolchains/$name/toolchain.toml does not exist at $built_from"
            python - "$RUNNER_TEMP/spec-$name.toml" "$entry" <<'PY' || fail "the pin's version does not match the spec at built_from"
          import json, sys, tomllib
          spec = tomllib.load(open(sys.argv[1], "rb"))["toolchain"]
          entry = json.loads(sys.argv[2])
          bad = [k for k in ("version", "revision", "platform") if spec[k] != entry[k]]
          sys.exit(f"mismatch in {bad}" if bad else 0)
          PY

            # 3. The manifest is exactly one toolchain layer, the one the pin names.
            oras manifest fetch "$ref" > "$RUNNER_TEMP/manifest-$name.json"
            jq -e --arg layer "sha256:$layer" '
              .artifactType == "application/vnd.quirq.toolchain.v1"
              and (.layers | length) == 1
              and .layers[0].digest == $layer
              and .layers[0].mediaType == "application/vnd.quirq.toolchain.layer.v1.tar+gzip"
            ' "$RUNNER_TEMP/manifest-$name.json" >/dev/null || fail "manifest is not one toolchain layer with digest sha256:$layer"

            # 4. The pulled bytes are that layer.
            dir="$RUNNER_TEMP/pull/$name"
            oras pull "$ref" -o "$dir"
            tarball=$(jq -r '.layers[0].annotations["org.opencontainers.image.title"]' "$RUNNER_TEMP/manifest-$name.json")
            echo "$layer  $dir/$tarball" | sha256sum --strict -c -
            python "$GATE/tools/qqtc.py" unpack "$dir/$tarball" "$RUNNER_TEMP/root/$name"
            echo "::endgroup::"
          done
          oras logout ghcr.io   # consumer code below runs without registry credentials
      - name: Smoke-test and build consumers from the pulled bytes
        if: steps.changed.outputs.count != '0'
        run: |
          for name in $(jq -r '.[].name' "$RUNNER_TEMP/changed.json"); do
            echo "::group::verify $name"
            python "$GATE/tools/qqtc.py" smoke "$name" "$RUNNER_TEMP/root/$name"
            python "$GATE/tools/qqtc.py" consumers "$name" "$RUNNER_TEMP/root/$name" --work "$RUNNER_TEMP/consumers/$name"
            echo "::endgroup::"
          done
